apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-docs-config
data:
  # Database
  POSTGRES_DB: "vector_docs"
  POSTGRES_PORT: "5432"

  # Embedding service
  EMBEDDING_MODEL_NAME: "nomic-embed-text"
  EMBEDDING_CHUNK_SIZE: "1200"
  EMBEDDING_CHUNK_OVERLAP: "80"

  # Search
  SEARCH_TOP_K: "10"

  # LLM API
  APP_CHAT_BASE_URL: "https://api.deepseek.com/v1"
  APP_CHAT_MODEL_NAME: "deepseek-v4-flash"

  # JWT
  JWT_TTL_SECONDS: "86400"

  # Internal UI URL (frontend service)
  INTERNAL_UI_URL: "http://frontend:80"

  # Mail SMTP
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_SMTP_STARTTLS_ENABLE: "true"

  # OCR
  TESSDATA_LANG: "eng"

  # Storage
  SITE_ROOT: "https://vector-docs.mnixa.duckdns.org"
  DEMO_USER_ID: "1"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Notification service host (used by answer-generator)
  APP_NOTIFICATION_HOST: "notification-service"
