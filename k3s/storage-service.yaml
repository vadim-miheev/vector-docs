apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-files
  namespace: vector-docs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: vector-docs
  labels:
    app: storage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
        - name: storage-service
          image: vector-docs/storage-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: vector-docs-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-docs-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: vector-docs-config
                  key: POSTGRES_DB
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: vector-docs-config
                  key: POSTGRES_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: ROOT_STORAGE_PATH
              value: "/files"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: vector-docs-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SITE_ROOT
              valueFrom:
                configMapKeyRef:
                  name: vector-docs-config
                  key: SITE_ROOT
            - name: STORAGE_SERVICE_HOST
              value: "http://$(SITE_ROOT)/api/storage"
            - name: INTERNAL_HOST
              value: "http://storage-service:8080"
            - name: DEMO_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: vector-docs-config
                  key: DEMO_USER_ID
          volumeMounts:
            - name: storage-files
              mountPath: /files
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: storage-files
          persistentVolumeClaim:
            claimName: storage-files
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: vector-docs
  labels:
    app: storage-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: storage-service
